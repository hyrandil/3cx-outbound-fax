; pjsip.conf  – wird beim Start aus .env befüllt (__PLATZHALTER__).
; Registrierung der Extension bei 3CX über den lokalen SBC (Outbound-Proxy),
; Endpoint für ausgehende T.38-Faxe.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:__SIP_BIND_PORT__

;=== Auth (3CX Auth-ID + Passwort) ===
[auth-3cx]
type = auth
auth_type = userpass
username = __SIP_AUTH_ID__
password = __SIP_PASSWORD__

;=== Registrierung bei 3CX (über Outbound-Proxy = SBC) ===
[reg-3cx]
type = registration
transport = transport-udp
server_uri = sip:__SIP_PROXY__
client_uri = sip:__SIP_EXTENSION__@__SIP_PROXY__
outbound_auth = auth-3cx
outbound_proxy = sip:__SIP_OUTBOUND_PROXY__:__SIP_PORT__\;lr
retry_interval = 30
forbidden_retry_interval = 60
expiration = 120
; 3CX erwartet die Extension als Contact-User (Default "s" führt v.a. bei
; Fax-Nebenstellen zu 200 OK OHNE Contact → Asterisk wertet das als Rejected)
contact_user = __SIP_EXTENSION__

;=== AOR / Endpoint für ausgehende Calls zu 3CX ===
[3cx]
type = aor
contact = sip:__SIP_PROXY__

[3cx]
type = endpoint
transport = transport-udp
context = from-3cx
disallow = all
allow = ulaw,alaw
aors = 3cx
outbound_auth = auth-3cx
from_user = __SIP_EXTENSION__
from_domain = __SIP_PROXY__
contact_user = __SIP_EXTENSION__
outbound_proxy = sip:__SIP_OUTBOUND_PROXY__:__SIP_PORT__\;lr
; --- Fax / T.38 ---
t38_udptl = yes
t38_udptl_ec = redundancy
t38_udptl_maxdatagram = 400
fax_detect = no
; Medien über Asterisk (nicht direct)
direct_media = no
rtp_symmetric = yes
force_rport = yes
; WICHTIG: rewrite_contact=no → Asterisk routet In-Dialog an die echte
; SBC-Adresse (Record-Route), nicht an die NAT-Quelladresse des Antwortpakets.
rewrite_contact = no

[3cx]
type = identify
endpoint = 3cx
match = __SIP_OUTBOUND_PROXY__
