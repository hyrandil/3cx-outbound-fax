; udptl.conf – Transport für T.38-Fax (UDPTL).
; Ohne diese Datei nutzt Asterisk Defaults und meldet beim Start eine ERROR-Zeile.
; Der Portbereich muss am Host/SBC für UDP erreichbar sein (hier lokal via SBC).
[general]
udptlstart = 4000
udptlend = 4999
; Prüfsummen im UDPTL-Header: bei manchen SBC/NAT-Pfaden stören sie – aus lassen.
udptlchecksums = no
; Fehlerkorrektur per Redundanz (passt zu t38_udptl_ec = redundancy in pjsip.conf).
udptlfecentries = 3
udptlfecspan = 3
use_even_ports = no
