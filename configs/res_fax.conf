[general]
; spandsp-Fax-Engine, Fehlerkorrektur (ECM) an, V.17 bis 14400 bps
maxrate = 14400
minrate = 2400
ecm = yes
statusevents = yes
modems = v17,v27,v29
; Wartezeit auf das T.38-Re-INVITE der Gegenseite nach Rufannahme.
; Default 5000 ms ist zu knapp: kommt das Re-INVITE (z.B. über eine
; Trunk-Schleife) ein paar Sekunden später, bricht SendFAX sonst mit
; "T.38 negotiation failed" ab – das war die Ursache sporadischer FAILED.
t38timeout = 12000

