[globals]

; Eingehende Calls (outbound-only) – ablehnen
[from-3cx]
exten => _.,1,Hangup()
exten => s,1,Hangup()

; Wird vom Call-File auf der geantworteten Ausgangs-Leitung ausgeführt.
; FAXFILE + RESULTFILE kommen als Channel-Variablen aus dem Call-File.
[fax-send]
exten => send,1,NoOp(SendFAX ${FAXFILE})
 same => n,Set(FAXOPT(ecm)=yes)
 same => n,Set(FAXOPT(localstationid)=${LOCALID})
 same => n,Set(FAXOPT(headerinfo)=${FAXHEADER})
 same => n,SendFAX(${FAXFILE})
 same => n,Hangup()

; Ergebnis IMMER im Hangup-Handler schreiben: die Gegenstelle (z.B. 3CX)
; legt nach dem Fax sofort auf – der lineare Dialplan käme dann nie bis zur
; System()-Zeile und die API liefe in ihren Timeout.
exten => h,1,NoOp(FAXSTATUS=${FAXSTATUS} STR=${FAXSTATUSSTR} PAGES=${FAXPAGES} RATE=${FAXBITRATE})
 same => n,GotoIf($["${RESULTFILE}" = ""]?done)
 same => n,System(/bin/sh -c 'echo "${IF($["${FAXSTATUS}" = ""]?FAILED:${FAXSTATUS})}|${FAXSTATUSSTR}|${FAXPAGES}" > "${RESULTFILE}"')
 same => n(done),NoOp()

; Wird ausgeführt, wenn der Call nicht zustande kcommt (failed-Extension des Call-Files)
exten => failed,1,NoOp(Fax-Call fehlgeschlagen)
 same => n,System(/bin/sh -c 'echo "FAILED|call-setup-failed|0" > "${RESULTFILE}"')
 same => n,Hangup()
