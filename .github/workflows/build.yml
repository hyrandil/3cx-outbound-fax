name: Build & Push Multi-Arch Image

# Baut das Image für amd64 + arm64 und pusht es nach GHCR,
# damit Endnutzer nur noch `docker compose up` (pull) machen müssen.
# (Alpine-Pakete, kein Source-Compile → Build dauert nur wenige Minuten.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # amfeld/3cx-outbound-fax

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # zum Pushen nach GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (für arm64-Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bei PRs nur bauen (nicht pushen); auf main/Tags pushen.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR verlangt Kleinschreibung → Repo-Name lowercasen
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/3cx-outbound-fax
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
